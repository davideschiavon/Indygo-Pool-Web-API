openapi: 3.0.3
info:
  title: Indygo-Pool-Web-API gateway (DRAFT)
  version: 0.0.1-draft
  description: |
    Draft contract for the REST API served by the ESP32 gateway so third-party applications can
    read and (later) control a connected pool device. **Nothing is implemented yet** and field
    names may change until milestone M2. Update this file together with any API change.
    Authentication is disabled by default (LAN use); an optional static token can be enabled in
    the gateway settings and is then sent as `Authorization: Bearer <token>`.
servers:
  - url: http://indygo-gateway.local/api/v1
paths:
  /gateway:
    get:
      summary: Gateway information (firmware version, Wi-Fi, BLE state)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gateway' }
  /ble/scan:
    post:
      summary: Start a BLE scan for compatible devices
      responses:
        '202': { description: Scan started }
    get:
      summary: State and results of the last scan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanning: { type: boolean }
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/BleDevice' }
  /wifi:
    get:
      summary: Network state (access-point or home-network mode). The password is never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wifi' }
    put:
      summary: Save the home Wi-Fi network; the gateway restarts and joins it
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, minLength: 1, maxLength: 32 }
                password: { type: string, description: Empty (open network) or 8-63 characters }
      responses:
        '202': { description: Saved, restarting }
        '422': { description: Invalid SSID or password length }
    delete:
      summary: Forget the saved network; the gateway restarts in access-point mode
      responses:
        '202': { description: Restarting }
  /wifi/scan:
    post:
      summary: Start a Wi-Fi network scan
      responses:
        '202': { description: Scan started }
    get:
      summary: State and results of the last Wi-Fi scan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanning: { type: boolean }
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        ssid: { type: string }
                        rssi: { type: integer }
                        secure: { type: boolean }
  /demo:
    get:
      summary: Demo mode state (simulated device with invented data)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
    put:
      summary: Enable or disable demo mode (persisted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Applied }
  /catalog:
    get:
      summary: Product families offered by the vendor app (MyIndygo build)
      description: Names and groups come from the app; descriptions are paraphrased. `demoPanel` tells which preview panel exists ("" = listed but not supported yet).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        group: { type: string, enum: [pool, relay] }
                        description: { type: string }
                        demoPanel: { type: string, enum: ['', pool, lighting, settings] }
  /sim:
    get:
      summary: State of the simulated pool equipment (demo mode only, 503 otherwise)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sim' }
        '503': { description: Demo mode off and no device connected }
  /commands:
    post:
      summary: Send a manual command (demo mode only for now)
      description: |
        Same JSON shape the vendor app passes to its `sendManualCommand`. Output `index`: 0 = filtration,
        1 = AUX1, 2 = AUX2 (ASSUMPTION for the demo). Durations in seconds (assumed). See docs/app-commands.md.
        Colour commands only work on an auxiliary configured as `lighting`. `pause` and `backwash` are not part of the
        simulated POOL COMMAND VS2 and are rejected.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [manualOn, stopManualCommand, boost, colorChange, colorChangeCCEI, colorChangeSeamaid]
                index: { type: integer, enum: [0, 1, 2], default: 0 }
                duration: { type: integer, description: 'manualOn 1-86400 s (default 3600)' }
                boostDuration: { type: integer, enum: [86400, 172800], description: 'boost: 24 h or 48 h, only while filtration is AUTO' }
                speed: { type: integer, description: 'filtration manualOn, 1-3' }
                mode: { type: integer, description: 'colorChangeCCEI: a CCEI value from the /sim palette; colorChangeSeamaid: 16, 32 or 48' }
      responses:
        '204': { description: Accepted }
        '422': { description: Unknown command, wrong state or value out of range }
        '503': { description: Demo mode off and no device connected }
  /filtration:
    put:
      summary: Set filtration mode and options (demo mode only). Fields are optional; an invalid field rejects the whole request.
      description: Modes follow the POOL COMMAND VS2 manual (docs/pool-command-vs2.md). Boost is only accepted in AUTO.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [off, 'on', auto] }
                speed: { type: integer, minimum: 1, maximum: 3 }
                autoKind: { type: string, enum: [variable, thermo, ranges], description: 'variable speed ranges / thermo-adaptive / time ranges (single-speed pump)' }
                dailyAdjustHours: { type: integer, minimum: -4, maximum: 4, description: thermo-adaptive daily adjustment }
                boost: { type: integer, enum: [0, 24, 48], description: 'hours; 0 stops the boost' }
                ranges:
                  type: array
                  maxItems: 8
                  items:
                  type: object
                  properties:
                    days: { type: integer, minimum: 1, maximum: 127, description: 'bit mask, bit 0 = Monday ... bit 6 = Sunday' }
                    start: { type: integer, minimum: 0, maximum: 1439, description: minutes from midnight }
                    end: { type: integer, minimum: 1, maximum: 1440 }
                    speed: { type: integer, minimum: 1, maximum: 3 }
      responses:
        '204': { description: Applied }
        '422': { description: Invalid value or not allowed in the current mode }
  /aux1:
    put:
      summary: Configure/command auxiliary 1 (demo mode only)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuxUpdate' }
      responses:
        '204': { description: Applied }
        '422': { description: Invalid value (heat pump type is not supported yet; treatment has OFF/AUTO only) }
  /aux2:
    put:
      summary: Configure/command auxiliary 2 (demo mode only)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuxUpdate' }
      responses:
        '204': { description: Applied }
        '422': { description: Invalid value }
  /dev:
    get:
      summary: Developer tools state (no password needed)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  passwordSet: { type: boolean }
                  bleLinked: { type: boolean }
                  writeEnabled: { type: boolean }
                  writeSecondsLeft: { type: integer }
  /dev/password:
    put:
      summary: Set or change the developer password
      description: Anyone can set the first password; changing it needs `current`. Stored as an unsalted SHA-256 hash.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 64 }
                current: { type: string }
      responses:
        '204': { description: Saved }
        '401': { description: Current password wrong }
        '422': { description: Password length invalid }
  /ota:
    post:
      summary: Install a firmware image over Wi-Fi (developer password required)
      description: multipart/form-data, field `file` = indygo_gateway.ino.bin. Restarts on success; no automatic rollback.
      security: [ { devPassword: [] } ]
      responses:
        '200': { description: Installed, restarting }
        '401': { description: Wrong or missing X-Dev-Password }
        '403': { description: No developer password set yet }
        '500': { description: Update failed }
  /dev/ble/connect:
    post:
      summary: Connect to a BLE device (developer password; demo mode must be off)
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string }
                addrType: { type: integer, enum: [0, 1], description: '0 public, 1 random' }
      responses:
        '200': { description: Connected }
        '502': { description: Could not connect (timeout) }
        '409': { description: Demo mode is on }
  /dev/ble/auth:
    post:
      summary: Perform the BLE session authentication handshake (see docs/ble-auth.md)
      description: |
        Reads the authentication characteristic; if it is a fresh nonce, encrypts it AES-128-ECB-NoPadding
        with the key from the gateway's local ble_secrets.h (never exposed by this API) and writes the
        response back. Requires BLE writes to be unlocked first. The key is not published in this project;
        see docs/ble-auth.md for how a maintainer supplies their own locally.
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BleCharRef' }
      responses:
        '200': { description: 'Body {authenticated, reused, note?}' }
        '403': { description: Writes are locked }
        '409': { description: Not connected, or BLE_AUTH_KEY_HEX not configured }
        '502': { description: Unexpected nonce length }
  /dev/ble/disconnect:
    post:
      summary: Disconnect the BLE explorer
      security: [ { devPassword: [] } ]
      responses:
        '204': { description: Done }
  /dev/ble/services:
    get:
      summary: Services and characteristics of the connected device
      security: [ { devPassword: [] } ]
      responses:
        '200': { description: OK }
        '409': { description: Not connected }
  /dev/ble/read:
    post:
      summary: Read a characteristic (hex)
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BleCharRef' }
      responses:
        '200': { description: 'Body {hex}' }
  /dev/ble/subscribe:
    post:
      summary: Listen for notifications/indications on a characteristic (results appear in the log)
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BleCharRef' }
      responses:
        '204': { description: Subscribed }
  /dev/ble/write-enable:
    put:
      summary: Unlock (or lock) BLE writes for a limited time
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                minutes: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '204': { description: Done }
  /dev/ble/write:
    post:
      summary: Write bytes to a characteristic (only while writes are unlocked; always logged)
      security: [ { devPassword: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                service: { type: string }
                characteristic: { type: string }
                hex: { type: string, description: 'even-length hex, max 244 bytes' }
                response: { type: boolean, default: true }
      responses:
        '204': { description: Written }
        '403': { description: Writes are locked }
  /dev/ble/log:
    get:
      summary: BLE explorer log (connects, reads, notifications, writes)
      security: [ { devPassword: [] } ]
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: only entries with a higher sequence number }
      responses:
        '200': { description: 'Body {last, entries[{seq,ms,dir,uuid,hex}]}, dir: C connect, R read, N notify, W write' }
  /device:
    get:
      summary: Selected pool device (connection state, model, firmware)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    put:
      summary: Select the BLE device the gateway should connect to
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string, description: BLE address }
      responses:
        '204': { description: Selected }
  /status:
    get:
      summary: Latest measurements and operating state (demo mode only for now)
      responses:
        '503': { description: No device connected }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /config:
    get:
      summary: Current device configuration (demo mode only for now)
      responses:
        '503': { description: No device connected }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
    put:
      summary: Change configuration (milestone M3, requires write support enabled)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Config' }
      responses:
        '204': { description: Applied }
        '422': { description: Value outside the allowed range, nothing applied }
        '503': { description: No device connected }
  /events:
    get:
      summary: Server-Sent Events stream of status changes
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    devPassword:
      type: apiKey
      in: header
      name: X-Dev-Password
  schemas:
    BleCharRef:
      type: object
      properties:
        service: { type: string }
        characteristic: { type: string }
    Gateway:
      type: object
      properties:
        firmware: { type: string }
        uptimeSeconds: { type: integer }
        wifiRssi: { type: integer }
        bleConnected: { type: boolean }
        scanning: { type: boolean }
    AuxUpdate:
      type: object
      properties:
        type: { type: string, enum: [lighting, treatment, robot, other], description: Changing the type resets mode and ranges }
        mode: { type: string, enum: [off, 'on', auto], description: 'treatment accepts off and auto only' }
        shutterMode: { type: boolean, description: treatment cover mode }
        shutterRate: { type: integer, minimum: 0, maximum: 60, description: 'minutes per hour while the cover is closed' }
        ranges:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              days: { type: integer, minimum: 1, maximum: 127, description: 'bit mask, bit 0 = Monday ... bit 6 = Sunday' }
              start: { type: integer, minimum: 0, maximum: 1439, description: minutes from midnight }
              end: { type: integer, minimum: 1, maximum: 1440 }
              speed: { type: integer, minimum: 1, maximum: 3 }
    Sim:
      type: object
      description: ILLUSTRATIVE simulated POOL COMMAND VS2 state (demo mode). Schedules are stored, not evaluated.
      properties:
        demo: { type: boolean }
        pool:
          type: object
          properties:
            mode: { type: string, enum: [off, 'on', auto] }
            speed: { type: integer }
            autoKind: { type: string, enum: [variable, thermo, ranges] }
            dailyAdjustHours: { type: integer }
            remainingSeconds: { type: integer, description: timed manual ON }
            boost:
              type: object
              properties:
                active: { type: boolean }
                remainingSeconds: { type: integer }
            running: { type: boolean, nullable: true, description: 'null = AUTO, depends on the (unsimulated) schedule' }
            forcedBy: { type: string, description: 'e.g. "AUX2 robot" when an auxiliary forces filtration' }
            ranges: { type: array, items: { type: object } }
        aux:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              type: { type: string }
              mode: { type: string }
              remainingSeconds: { type: integer }
              shutterMode: { type: boolean }
              shutterRate: { type: integer }
              note: { type: string }
              ranges: { type: array, items: { type: object } }
        lighting:
          type: object
          properties:
            auxIndex: { type: integer, description: '1 or 2, 0 if no auxiliary is set to lighting' }
            on: { type: boolean }
            spotlight: { type: string, enum: [CCEI, Seamaid] }
            color: { type: string }
            colorValue: { type: integer }
            remainingSeconds: { type: integer }
            palette:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: integer }
                  kind: { type: string, enum: [white, color, level, program, speed, save] }
        water:
          type: object
          properties:
            temperatureC: { type: number }
    Wifi:
      type: object
      properties:
        mode: { type: string, enum: [ap, sta] }
        connected: { type: boolean }
        ssid: { type: string, description: Joined network (sta mode) }
        savedSsid: { type: string, description: Network stored in flash, if any }
        ip: { type: string }
        apSsid: { type: string, description: First-connection access point name (ap mode) }
        hostname: { type: string, example: indygo-gateway.local }
    BleDevice:
      type: object
      properties:
        address: { type: string }
        name: { type: string }
        rssi: { type: integer }
        family: { type: string, enum: [pooltech, sterilor_evo, solem_ipx, unknown] }
        services: { type: string, description: Comma-separated advertised service UUIDs }
        manufacturerData: { type: string, description: Advertised manufacturer data, hex }
    Device:
      type: object
      properties:
        address: { type: string, description: Selected BLE address, empty if none }
        name: { type: string }
        connected: { type: boolean, description: Always false until the BLE connection is implemented }
    Status:
      type: object
      description: |
        ILLUSTRATIVE field set. Today it is only served in demo mode with INVENTED values; the real
        fields will be defined once the BLE protocol is decoded and may differ.
      properties:
        demo: { type: boolean }
        uptimeSeconds: { type: integer }
        ph: { type: number }
        orp: { type: integer, description: mV }
        saltGramsPerLiter: { type: number }
        waterTemperatureC: { type: number }
        mode: { type: string, enum: [off, auto, 'on'] }
        productionPercent: { type: integer, minimum: 0, maximum: 100 }
        boostRemainingMinutes: { type: integer }
        winterMode: { type: boolean }
        alarms:
          type: array
          items: { type: string }
    Config:
      type: object
      description: |
        ILLUSTRATIVE (demo mode only). Ranges are enforced; an out-of-range field rejects the whole request.
      properties:
        phSetpoint: { type: number, minimum: 6.8, maximum: 7.8 }
        orpSetpoint: { type: integer, minimum: 400, maximum: 900 }
        productionPercent: { type: integer, minimum: 0, maximum: 100 }
        mode: { type: string, enum: [off, auto, 'on'] }
        boost: { type: boolean }
        winterMode: { type: boolean }
