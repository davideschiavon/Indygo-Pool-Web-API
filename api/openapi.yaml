openapi: 3.0.3
info:
  title: Indygo-Pool-Web-API gateway (DRAFT)
  version: 0.0.1-draft
  description: |
    Draft contract for the REST API served by the ESP32 gateway so third-party applications can
    read and (later) control a connected pool device. **Nothing is implemented yet** and field
    names may change until milestone M2. Update this file together with any API change.
    Authentication is disabled by default (LAN use); an optional static token can be enabled in
    the gateway settings and is then sent as `Authorization: Bearer <token>`.
servers:
  - url: http://indygo-gateway.local/api/v1
paths:
  /gateway:
    get:
      summary: Gateway information (firmware version, Wi-Fi, BLE state)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gateway' }
  /ble/scan:
    post:
      summary: Start a BLE scan for compatible devices
      responses:
        '202': { description: Scan started }
    get:
      summary: State and results of the last scan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanning: { type: boolean }
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/BleDevice' }
  /wifi:
    get:
      summary: Network state (access-point or home-network mode). The password is never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wifi' }
    put:
      summary: Save the home Wi-Fi network; the gateway restarts and joins it
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, minLength: 1, maxLength: 32 }
                password: { type: string, description: Empty (open network) or 8-63 characters }
      responses:
        '202': { description: Saved, restarting }
        '422': { description: Invalid SSID or password length }
    delete:
      summary: Forget the saved network; the gateway restarts in access-point mode
      responses:
        '202': { description: Restarting }
  /wifi/scan:
    post:
      summary: Start a Wi-Fi network scan
      responses:
        '202': { description: Scan started }
    get:
      summary: State and results of the last Wi-Fi scan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanning: { type: boolean }
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        ssid: { type: string }
                        rssi: { type: integer }
                        secure: { type: boolean }
  /demo:
    get:
      summary: Demo mode state (simulated device with invented data)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
    put:
      summary: Enable or disable demo mode (persisted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: Applied }
  /catalog:
    get:
      summary: Product families offered by the vendor app (MyIndygo build)
      description: Names and groups come from the app; descriptions are paraphrased. `demoPanel` tells which preview panel exists ("" = listed but not supported yet).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        group: { type: string, enum: [pool, relay] }
                        description: { type: string }
                        demoPanel: { type: string, enum: ['', pool, lighting, settings] }
  /sim:
    get:
      summary: State of the simulated pool equipment (demo mode only, 503 otherwise)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sim' }
        '503': { description: Demo mode off and no device connected }
  /commands:
    post:
      summary: Send a manual command (demo mode only for now)
      description: |
        Same JSON shape the vendor app passes to its `sendManualCommand`. Output `index` 0 = filtration pump,
        1 = lighting (ASSUMPTION for the demo). Durations in seconds (assumed). See docs/app-commands.md.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [manualOn, stopManualCommand, boost, pause, backwash, colorChange, colorChangeCCEI, colorChangeSeamaid]
                index: { type: integer, default: 0 }
                duration: { type: integer, description: 'manualOn 1-86400 s (default 3600); backwash 10-1800 s (default 120)' }
                boostDuration: { type: integer, description: 'boost 60-604800 s (default 86400)' }
                pauseDurationInDays: { type: integer, description: 'pause 1-30' }
                speed: { type: integer, description: 'variable-speed pumps, 1-3 (default 2)' }
                mode: { type: integer, description: 'colorChangeCCEI: a CCEI value from the /sim palette; colorChangeSeamaid: 16, 32 or 48' }
      responses:
        '204': { description: Accepted }
        '422': { description: Unknown command or value out of range }
        '503': { description: Demo mode off and no device connected }
  /pool:
    put:
      summary: Set the filtration rule (demo mode only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule: { type: integer, enum: [0, 1, 2], description: '0 time, 1 thermo-adaptive, 2 variable speed pump' }
      responses:
        '204': { description: Applied }
        '422': { description: Invalid rule }
  /device:
    get:
      summary: Selected pool device (connection state, model, firmware)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    put:
      summary: Select the BLE device the gateway should connect to
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string, description: BLE address }
      responses:
        '204': { description: Selected }
  /status:
    get:
      summary: Latest measurements and operating state (demo mode only for now)
      responses:
        '503': { description: No device connected }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /config:
    get:
      summary: Current device configuration (demo mode only for now)
      responses:
        '503': { description: No device connected }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
    put:
      summary: Change configuration (milestone M3, requires write support enabled)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Config' }
      responses:
        '204': { description: Applied }
        '422': { description: Value outside the allowed range, nothing applied }
        '503': { description: No device connected }
  /events:
    get:
      summary: Server-Sent Events stream of status changes
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  schemas:
    Gateway:
      type: object
      properties:
        firmware: { type: string }
        uptimeSeconds: { type: integer }
        wifiRssi: { type: integer }
        bleConnected: { type: boolean }
        scanning: { type: boolean }
    Sim:
      type: object
      description: ILLUSTRATIVE simulated state (demo mode).
      properties:
        demo: { type: boolean }
        pool:
          type: object
          properties:
            rule: { type: integer }
            ruleName: { type: string }
            state: { type: string, enum: [auto, manualOn, boost, paused, backwash] }
            remainingSeconds: { type: integer }
            speed: { type: integer }
        lighting:
          type: object
          properties:
            on: { type: boolean }
            spotlight: { type: string, enum: [CCEI, Seamaid] }
            color: { type: string }
            colorValue: { type: integer }
            remainingSeconds: { type: integer }
            palette:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: integer }
                  kind: { type: string, enum: [white, color, level, program, speed, save] }
    Wifi:
      type: object
      properties:
        mode: { type: string, enum: [ap, sta] }
        connected: { type: boolean }
        ssid: { type: string, description: Joined network (sta mode) }
        savedSsid: { type: string, description: Network stored in flash, if any }
        ip: { type: string }
        apSsid: { type: string, description: First-connection access point name (ap mode) }
        hostname: { type: string, example: indygo-gateway.local }
    BleDevice:
      type: object
      properties:
        address: { type: string }
        name: { type: string }
        rssi: { type: integer }
        family: { type: string, enum: [pooltech, sterilor_evo, solem_ipx, unknown] }
        services: { type: string, description: Comma-separated advertised service UUIDs }
        manufacturerData: { type: string, description: Advertised manufacturer data, hex }
    Device:
      type: object
      properties:
        address: { type: string, description: Selected BLE address, empty if none }
        name: { type: string }
        connected: { type: boolean, description: Always false until the BLE connection is implemented }
    Status:
      type: object
      description: |
        ILLUSTRATIVE field set. Today it is only served in demo mode with INVENTED values; the real
        fields will be defined once the BLE protocol is decoded and may differ.
      properties:
        demo: { type: boolean }
        uptimeSeconds: { type: integer }
        ph: { type: number }
        orp: { type: integer, description: mV }
        saltGramsPerLiter: { type: number }
        waterTemperatureC: { type: number }
        mode: { type: string, enum: [off, auto, 'on'] }
        productionPercent: { type: integer, minimum: 0, maximum: 100 }
        boostRemainingMinutes: { type: integer }
        winterMode: { type: boolean }
        alarms:
          type: array
          items: { type: string }
    Config:
      type: object
      description: |
        ILLUSTRATIVE (demo mode only). Ranges are enforced; an out-of-range field rejects the whole request.
      properties:
        phSetpoint: { type: number, minimum: 6.8, maximum: 7.8 }
        orpSetpoint: { type: integer, minimum: 400, maximum: 900 }
        productionPercent: { type: integer, minimum: 0, maximum: 100 }
        mode: { type: string, enum: [off, auto, 'on'] }
        boost: { type: boolean }
        winterMode: { type: boolean }
